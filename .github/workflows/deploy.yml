name: Deploy

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install fastapi "scalar-fastapi>=1.8.2" uvicorn pytest httpx
      - run: pytest

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login no registry
        run: |
          REGISTRY_HOST=$(echo "${{ secrets.MGC_REGISTRY_NAME }}" | cut -d'/' -f1)
          echo "${{ secrets.MGC_REGISTRY_PASSWORD }}" | docker login https://$REGISTRY_HOST \
            -u "${{ secrets.MGC_REGISTRY_USER }}" --password-stdin

      - name: Build e push da imagem
        run: |
          docker build -t ${{ secrets.MGC_REGISTRY_NAME }}/orders-api:${{ github.sha }} .
          docker push ${{ secrets.MGC_REGISTRY_NAME }}/orders-api:${{ github.sha }}

      - name: Configurar kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.MGC_KUBECONFIG }}" > ~/.kube/config

      - name: Deploy no Kubernetes
        run: |
          set -euo pipefail
          export IMAGE="${{ secrets.MGC_REGISTRY_NAME }}/orders-api:${{ github.sha }}"
          
          # Aplica o manifesto substituindo a variável de imagem de forma limpa
          envsubst < k8s/app.yaml | kubectl apply -f -
          
          # Aguarda o rollout com um timeout seguro de 5 minutos
          if ! kubectl rollout status deployment/orders-api --timeout=5m; then
            echo "Rollout falhou — coletando diagnósticos do cluster..."
            echo "=== Deployment describe ==="
            kubectl describe deployment/orders-api || true
            echo "=== Pods (detailed) ==="
            kubectl get pods -l app=orders-api -o wide || true
            echo "=== Pod describe & logs para os pods ==="
            for p in $(kubectl get pods -l app=orders-api -o name); do
              echo "--- $p ---"
              kubectl describe $p || true
              kubectl logs $p --all-containers --tail=200 || true
              kubectl logs $p --all-containers --previous --tail=200 || true
            done
            echo "=== Eventos recentes ==="
            kubectl get events --sort-by=.metadata.creationTimestamp || true
            exit 1
          fi
